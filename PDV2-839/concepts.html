<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Route Coverage Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* Tokens matched to the live merchant dashboard (s.salla.sa/shipping/setting/routes) */
  :root {
    --nav-bg:        #0E3B45;
    --teal:          #004D5A;
    --teal-lt:       #EEF7F8;
    --mint:          #BAF3E6;
    --mint-border:   #5DD5C4;
    --mint-lt:       #EFFCF9;
    --blue:          #2F6FDB;
    --blue-lt:       #EAF2FD;
    --green:         #1A8F5A;
    --green-lt:      #E7F6EE;
    --amber:         #B7791F;
    --amber-lt:      #FEF6E4;
    --red:           #DC2626;
    --red-lt:        #FDECEC;
    --page:          #F7F7F7;
    --surface:       #FFFFFF;
    --text:          #1F2937;
    --muted:         #6B7280;
    --subtle:        #9CA3AF;
    --border:        #E5E7EB;
    --field:         #FFFFFF;
    --radius-card:   16px;
    --radius-field:  8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.6; padding-bottom: 96px; }
  button { font: inherit; }
  bdi { unicode-bidi: isolate; }

  /* Prototype switcher (not product UI) */
  .proto { background: #111827; color: #F9FAFB; padding: 8px 16px; display: flex; gap: 12px; align-items: center; overflow-x: auto; font-size: 13px; }
  .proto b { white-space: nowrap; color: var(--mint); }
  .proto button { white-space: nowrap; border: 1px solid #374151; background: transparent; color: #E5E7EB; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  .proto button[aria-selected="true"] { background: var(--mint); color: var(--teal); border-color: var(--mint); font-weight: 700; }
  .note { max-width: 1400px; margin: 16px auto 0; padding: 0 16px; }
  .note div { border: 1px dashed #A78BFA; background: #F5F3FF; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #4C1D95; }
  .note b { color: #5B21B6; }

  /* Live chrome */
  .topbar { background: var(--nav-bg); color: #fff; height: 72px; display: flex; align-items: center; gap: 28px; padding: 0 32px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; line-height: 1; }
  .logo svg { width: 40px; height: 40px; }
  .topnav { display: flex; gap: 22px; font-size: 15px; }
  .topnav span { display: inline-flex; gap: 6px; align-items: center; opacity: .95; white-space: nowrap; }
  .tools svg { width: 20px; height: 20px; }
  .tools { margin-inline-start: auto; display: flex; gap: 16px; align-items: center; }
  .progress { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--teal); display: grid; place-items: center; font-size: 11px; font-weight: 700; box-shadow: inset 0 0 0 3px var(--mint-border); }
  .store { text-align: center; font-size: 14px; line-height: 1.2; }
  .store i { display: inline-block; font-style: normal; border: 1px solid #ffffff80; border-radius: 999px; padding: 0 10px; font-size: 12px; margin-top: 2px; }
  .subnav { background: var(--surface); height: 60px; display: flex; align-items: center; gap: 28px; padding: 0 32px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .subnav a { color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 15px; padding: 18px 0; border-bottom: 2px solid transparent; cursor: pointer; }
  .subnav a.on { color: var(--teal); border-bottom-color: var(--teal); font-weight: 500; }
  .subnav .end { margin-inline-start: auto; display: flex; gap: 12px; }
  .pill-ai { border: 1px solid #FCD9A8; background: linear-gradient(90deg,#FFF8EE,#EFFCF9); border-radius: 10px; padding: 6px 14px; color: var(--teal); white-space: nowrap; }
  @media (max-width: 1100px) { .topnav { display: none; } }
  @media (max-width: 640px) { .topbar, .subnav { padding: 0 16px; } .tools .hide-sm { display: none; } }

  /* Page */
  .page { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border-radius: var(--radius-card); padding: 24px; margin-bottom: 24px; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .card h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--teal); }
  .card h2 small { font-size: 12px; color: var(--muted); font-weight: 400; margin-inline-start: 6px; }
  .aside { position: sticky; top: 16px; }

  .field { margin-top: 20px; }
  .field > label, .lbl { display: block; font-size: 15px; font-weight: 500; margin-bottom: 8px; }
  .req::after { content: ' *'; color: var(--red); }
  .input { width: 100%; min-height: 42px; border: 1px solid var(--border); border-radius: var(--radius-field); padding: 6px 14px; background: var(--field); color: var(--text); font: inherit; display: flex; align-items: center; gap: 8px; text-align: start; }
  .input::placeholder, .ph { color: var(--subtle); }
  .input.select { cursor: pointer; justify-content: space-between; }
  .input.select .chev { color: var(--muted); flex: none; }
  .input.disabled { background: #FAFAFA; color: var(--subtle); cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 720px) { .grid3 { grid-template-columns: 1fr; } }
  .type { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; background: var(--surface); text-align: start; cursor: pointer; color: var(--text); }
  .type b { display: block; font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .type span { color: var(--muted); font-size: 13px; }
  .type[aria-pressed="true"] { border: 2px solid var(--mint-border); background: var(--mint-lt); padding: 15px 19px; }
  .type[aria-pressed="true"] b, .type[aria-pressed="true"] span { color: var(--teal); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--teal); margin: 2px 0 0; flex: none; }
  .check b { font-weight: 500; font-size: 15px; }
  .check span { display: block; color: var(--muted); font-size: 12px; }
  .switch { width: 46px; height: 26px; border-radius: 999px; background: var(--teal); position: relative; flex: none; display: inline-block; }
  .switch::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .switch.off { background: #E5E7EB; }
  .switch.off::after { inset-inline-start: auto; inset-inline-end: 3px; }

  /* Dropdown */
  .dd { position: relative; }
  .dd-panel { position: absolute; inset-inline: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgba(15,23,42,.12); z-index: 20; overflow: hidden; min-width: 260px; }
  .dd-search { display: flex; align-items: center; gap: 8px; margin: 10px; height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; color: var(--subtle); }
  .dd-search input { border: 0; outline: 0; flex: 1; font: inherit; background: transparent; color: var(--text); }
  .dd-list { max-height: 280px; overflow: auto; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
  .opt:hover { background: #F9FAFB; }
  .opt input { width: 18px; height: 18px; accent-color: var(--teal); flex: none; }
  .opt .side { margin-inline-start: auto; font-size: 12px; color: var(--muted); text-align: end; }
  .opt .warn { color: var(--amber); }
  .opt.off { cursor: not-allowed; color: var(--subtle); }
  .opt.off:hover { background: none; }
  .opt .reg { color: var(--muted); font-size: 12px; }
  .empty-row { padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }
  .logo-sq { width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 6px; background: var(--teal-lt); color: var(--teal); font-size: 13px; border: 1px solid transparent; }
  .chip.bad { background: var(--red-lt); color: var(--red); border-color: #FCA5A5; }
  .chip button { border: 0; background: none; cursor: pointer; color: inherit; padding: 0; font-size: 15px; line-height: 1; }

  /* Conditions */
  .empty { text-align: center; padding: 28px 0 8px; }
  .empty .ico { width: 88px; height: 88px; border-radius: 50%; background: #F3F4F6; display: grid; place-items: center; margin: 0 auto 16px; }
  .empty h3 { margin: 0 0 4px; font-size: 18px; font-weight: 500; }
  .empty p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .btn-out { border: 1px solid var(--mint-border); color: var(--teal); background: var(--surface); border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .radios { display: inline-flex; gap: 20px; background: #F9FAFB; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .radios label { display: inline-flex; gap: 6px; align-items: center; }
  .radios input { accent-color: var(--teal); width: 18px; height: 18px; }
  .cond-row { display: grid; grid-template-columns: minmax(0,1fr) 42px; gap: 12px; align-items: end; }
  .region-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)) 42px; gap: 12px; align-items: start; }
  @media (max-width: 720px) { .region-row { grid-template-columns: 1fr; } .region-row .icon-btn { display: none; } }
  .icon-btn { width: 42px; height: 42px; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; margin-top: 30px; }
  .cond-row .icon-btn { margin-top: 0; }
  .sub-h { font-size: 15px; font-weight: 500; margin: 24px 0 4px; }

  /* Alerts and buttons */
  .alert { border-radius: 10px; padding: 12px 14px; margin: 16px 0 0; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
  .alert .grow { flex: 1; }
  .alert.info { background: var(--teal-lt); color: var(--teal); }
  .alert.warn { background: var(--amber-lt); }
  .alert.err { background: var(--red-lt); color: #991B1B; }
  .alert.ok { background: var(--green-lt); color: #065F46; }
  .alert .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn-mint { background: var(--mint); color: var(--teal); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 500; }
  .btn-mint.sm, .btn-ghost.sm { padding: 6px 12px; font-size: 13px; }
  .btn-ghost { background: var(--surface); border: 1px solid var(--mint-border); color: var(--teal); border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  .btn-blue { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; white-space: nowrap; }
  .linkish { border: 0; background: none; color: var(--teal); text-decoration: underline; cursor: pointer; padding: 0; }
  .savebar { position: fixed; bottom: 0; inset-inline: 0; z-index: 15; pointer-events: none; }
  .savebar .inner { max-width: 1400px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 24px; }
  .savebar .bar { pointer-events: auto; background: var(--surface); box-shadow: 0 -6px 24px rgba(15,23,42,.08); border-radius: 12px 12px 0 0; padding: 16px 24px; display: flex; gap: 12px; align-items: center; }
  @media (max-width: 960px) { .savebar .inner { grid-template-columns: 1fr; } }

  /* Summary */
  .sum-empty { text-align: center; padding: 32px 0 12px; }
  .sum-empty .ico { width: 110px; height: 110px; border-radius: 50%; background: #F3F4F6; display: grid; place-items: center; margin: 0 auto 20px; }
  .sum-empty h3 { margin: 0; font-size: 18px; font-weight: 500; }
  .sum-empty p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .sum-box { background: #F9FAFB; border-radius: 10px; padding: 12px; margin-top: 12px; }
  .sum-inner { background: var(--surface); border-radius: 8px; padding: 14px; }
  .sum-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .num { width: 40px; height: 40px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; font-weight: 700; }
  .sum-opt { border: 1px solid #111; border-radius: 6px; padding: 12px; display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .sum-opt .ri { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #111; flex: none; }
  .sum-opt.on .ri { box-shadow: inset 0 0 0 4px #fff; background: #111; }
  .sum-opt .tr { width: 32px; height: 32px; border-radius: 6px; background: #F3F4F6; display: grid; place-items: center; margin-inline-start: auto; }
  .sum-opt small { display: block; color: var(--muted); font-size: 11px; }
  .big { font-size: 32px; font-weight: 700; color: var(--teal); line-height: 1.2; }
  .meter { height: 8px; border-radius: 4px; background: var(--red-lt); overflow: hidden; margin: 10px 0; }
  .meter span { display: block; height: 100%; background: var(--green); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; white-space: nowrap; }
  .tag.bad { background: var(--red-lt); color: var(--red); }
  .tag.ok { background: var(--green-lt); color: var(--green); }
  .tag.mute { background: #F3F4F6; color: var(--muted); }
  .tag.mint { background: var(--mint); color: var(--teal); font-size: 14px; padding: 2px 12px; }
  .reg-line { margin-top: 6px; font-size: 13px; }
  .muted { color: var(--muted); }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* Tables */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #FAFAFA; color: var(--text); font-weight: 500; padding: 14px 16px; text-align: start; white-space: nowrap; }
  td { padding: 16px; border-bottom: 1px solid #F1F1F1; text-align: start; }
  td.y { color: var(--green); font-weight: 700; text-align: center; }
  td.n { color: var(--subtle); text-align: center; }
  th.carrier-h { cursor: pointer; text-align: center; }
  th.carrier-h:hover { background: var(--red-lt); color: var(--red); }
  tr.bad td:first-child { color: var(--red); font-weight: 500; }
  .rank { width: 26px; height: 26px; border-radius: 50%; background: var(--mint); color: var(--teal); display: inline-grid; place-items: center; font-size: 12px; }
  .route-link { color: var(--teal); border: 0; background: none; cursor: pointer; font: inherit; font-size: 15px; padding: 0; }
  .banner { background: var(--blue-lt); border-inline-start: 4px solid var(--blue); border-radius: 14px; padding: 18px 22px; display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
  .banner h3 { margin: 0; font-size: 20px; color: #1E3A8A; }
  .banner p { margin: 2px 0 0; color: #1E3A8A; font-size: 14px; }
  .banner .grow { flex: 1; }
  .def { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .def h3 { margin: 0; font-size: 18px; font-weight: 500; display: flex; gap: 10px; align-items: center; }
  .search { height: 50px; border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--subtle); margin: 16px 0; }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 0; color: var(--muted); font-size: 13px; flex-wrap: wrap; gap: 8px; }
  .score td, .score th { text-align: center; }
  .score td:first-child, .score th:first-child, .score td:last-child, .score th:last-child { text-align: start; }
  .keep { color: var(--green); font-weight: 700; }
  .kill { color: var(--muted); text-decoration: line-through; }
  .ship-opt { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .dead { text-align: center; padding: 20px 12px; color: var(--red); }
  .toast { position: fixed; inset-inline-start: 16px; bottom: 96px; background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 30; }
  .fab { position: fixed; inset-inline-end: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--mint-border); display: grid; place-items: center; z-index: 16; }
</style>
</head>
<body>
<div class="proto" role="tablist" id="tabs"></div>
<div id="chrome"></div>
<div id="note" class="note"></div>
<main class="page" id="app"></main>
<div id="savebar"></div>
<div class="fab" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0E3B45" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8 13c2 2 6 2 8 0"/></svg></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Icons ---------- */
const I = {
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  truck: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>',
  doc: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  cond: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 16h8M9 11h.01M15 11h.01M12 3v4"/></svg>',
  gear: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>',
  bigtruck: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="1.4"><path d="M2 7h12v9H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
};

/* ---------- Data (illustrative, not real pricing) ---------- */
const CITIES = [
  ['ruh','الرياض','منطقة الرياض'],['dir','الدرعية','منطقة الرياض'],['jed','جدة','منطقة مكة المكرمة'],['mak','مكة','منطقة مكة المكرمة'],
  ['taif','الطائف','منطقة مكة المكرمة'],['med','المدينة المنورة','منطقة المدينة المنورة'],['ynb','ينبع','منطقة المدينة المنورة'],
  ['dmm','الدمام','المنطقة الشرقية'],['khb','الخبر','المنطقة الشرقية'],['ahs','الأحساء','المنطقة الشرقية'],['qat','القطيف','المنطقة الشرقية'],
  ['jub','الجبيل','المنطقة الشرقية'],['hfb','حفر الباطن','المنطقة الشرقية'],['bur','بريدة','منطقة القصيم'],['una','عنيزة','منطقة القصيم'],
  ['hai','حائل','منطقة حائل'],['tbk','تبوك','منطقة تبوك'],['abh','أبها','منطقة عسير'],['khm','خميس مشيط','منطقة عسير'],
  ['jaz','جازان','منطقة جازان'],['njr','نجران','منطقة نجران'],['bah','الباحة','منطقة الباحة'],['arr','عرعر','منطقة الحدود الشمالية'],['skk','سكاكا','منطقة الجوف']
].map(([id,name,region]) => ({id,name,region}));
const CITY = Object.fromEntries(CITIES.map(c => [c.id, c]));
const ALL = CITIES.map(c => c.id);

const CARRIERS = [
  {id:'redbox', name:'ريدبوكس', color:'#D9363E', mark:'R', cities:['ruh','jed','dmm','khb','mak','med']},

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const bn = s => `<bdi>${esc(s)}</bdi>`;
const logo = c => `<span class="logo-sq" style="background:${c.color}">${c.mark}</span>`;
function nCities(n) {
  if (n === 0) return 'لا مدن';
  if (n === 1) return 'مدينة واحدة';
  if (n === 2) return 'مدينتان';
  if (n <= 10) return `${n} مدن`;
  return `${n} مدينة`;
}
function nCitiesG(n) { return n === 2 ? 'مدينتين' : nCities(n); }
function nRoutes(n) {
  if (n === 1) return 'مسار واحد';
  if (n === 2) return 'مساران';
  if (n <= 10) return `${n} مسارات`;
  return `${n} مسارًا`;
}
function namesList(ids, max = 5) {
  const names = ids.map(id => CITY[id].name);
  if (names.length <= max) return names.join('، ');
  const rest = names.length - max;
  return names.slice(0, max).join('، ') + ` و${rest === 1 ? 'مدينة أخرى' : rest === 2 ? 'مدينتان أخريان' : ' ' + nCities(rest) + ' أخرى'}`;
}
function coverage(carrierIds) {
  const s = new Set();
  carrierIds.forEach(id => CAR[id].cities.forEach(c => s.add(c)));
  return s;
}
function coveredBy(city, carrierIds) { return carrierIds.filter(id => CAR[id].cities.includes(city)); }
function byRegion(ids) {
  const g = {};
  ids.forEach(id => { (g[CITY[id].region] ||= []).push(id); });
  return g;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}
function newState(extra = {}) {
  return Object.assign({ type: 'pick', carriers: [], regionOn: false, cities: [], excluded: [], q: '', open: '',
    removed: {}, notice: null, saveMsg: null, preview: null }, extra);
}

function ddTrigger(k, name, inner, opts = {}) {

  return `<div class="input select" data-act="dd" data-k="${k}" data-v="${name}" role="button" tabindex="0" aria-expanded="${st.open===name}">${inner}${I.chev}</div>`;
}
function infoCard(k, st) {

    ['custom','تسمية خاصة','أخفِ أسماء شركات الشحن، وأظهر اسمًا يعكس علامتك التجارية.']];

    <div class="field"><label class="req">اختر شركات الشحن</label>${carrierDD(k, st)}</div>

function carrierDD(k, st) {
  const inner = st.carriers.length
    ? `<span class="chips">${st.carriers.map(id => `<span class="chip">${bn(CAR[id].name)}<button data-act="uncarrier" data-k="${k}" data-v="${id}" aria-label="إزالة">×</button></span>`).join('')}</span>`
    : `<span class="ph">اختر شركات الشحن</span>`;
  const panel = st.open === 'carriers' ? `<div class="dd-panel"><div class="dd-search">${I.search}<input placeholder="ابحث"></div><div class="dd-list">${CARRIERS.map(c => {
    const on = st.carriers.includes(c.id);
    return `<label class="opt"><input type="checkbox" data-act="carrier" data-k="${k}" data-v="${c.id}" ${on?'checked':''}>${logo(c)} ${bn(c.name)}
      <span class="side">${c.cities.length ? `تغطي ${nCitiesG(c.cities.length)}` : `<span class="warn">لا توجد تسعيرة لهذا السوق</span>`}</span></label>`;
  }).join('')}</div></div>` : '';
  return `<div class="dd">${ddTrigger(k, 'carriers', inner)}${panel}</div>`;
}
/* mode: 'hide' (candidate #0) | 'mark' (uncovered shown disabled with the reason) */
function cityDD(k, st, mode) {
  const filtering = st.type !== 'custom';
  const cov = coverage(st.carriers);
  if (filtering && !st.carriers.length) return `${ddTrigger(k, 'cities', 'اختر المدينة', {disabled:true})}<div class="hint">اختر شركة شحن أولاً لعرض المدن المتاحة</div>`;
  const inner = st.cities.length ? `<span>${nCities(st.cities.length)}</span>` : `<span class="ph">اختر المدينة</span>`;
  let panel = '';
  if (st.open === 'cities') {
    const q = st.q.trim();
    let rows = CITIES.filter(c => !q || c.name.includes(q) || c.region.includes(q));
    const missHits = filtering ? rows.filter(c => !cov.has(c.id)) : [];
    if (mode === 'hide' && filtering) rows = rows.filter(c => cov.has(c.id));
    const list = rows.map(c => {
      const ok = !filtering || cov.has(c.id);
      if (!ok) return `<div class="opt off"><input type="checkbox" disabled>${esc(c.name)} <span class="reg">- ${esc(c.region)}</span><span class="side">لا توصل لها شركاتك المختارة</span></div>`;
      return `<label class="opt"><input type="checkbox" data-act="city" data-k="${k}" data-v="${c.id}" ${st.cities.includes(c.id)?'checked':''}>${esc(c.name)} <span class="reg">- ${esc(c.region)}</span></label>`;
    }).join('');
    let foot = '';
    if (mode === 'hide' && q && missHits.length) foot = `<div class="empty-row">شركات الشحن المختارة لا توصل إلى ${esc(missHits.map(c => c.name).join('، '))}</div>`;
    else if (!rows.length) foot = `<div class="empty-row">لا توجد نتائج</div>`;
    panel = `<div class="dd-panel"><div class="dd-search">${I.search}<input data-act="q" data-k="${k}" placeholder="ابحث" value="${esc(st.q)}"></div><div class="dd-list">${list}${foot}</div></div>`;
  }
  return `<div class="dd">${ddTrigger(k, 'cities', inner)}${panel}</div>`;
}

}

function summaryList(st) {

    ${st.carriers.map((id, i) => `<div class="sum-opt ${i===0?'on':''}"><span class="ri"></span><div><b style="font-weight:500">${bn(CAR[id].name)}</b><small>التوصيل خلال 2-3 أيام عمل</small></div><span class="tr">${I.truck}</span></div>`).join('')}
    </div></div>`;
}
function summaryCard(st, extra = '') {
  return `<aside class="aside"><div class="card"><h2>الملخص</h2>${extra}${extra ? '<div class="divider"></div>' : ''}${summaryList(st)}</div></aside>`;
}
function validate(st) {
  if (!st.carriers.length) return {kind:'err', html:'اختر شركة شحن واحدة على الأقل.'};
  if (st.regionOn && !st.cities.length) return {kind:'err', html:'أضف وجهة واحدة على الأقل.'};
  if (st.type !== 'custom' && st.regionOn) {
    const cov = coverage(st.carriers);
    const bad = st.cities.filter(c => !cov.has(c));
    if (bad.length) return {kind:'err', html:`لا يمكن حفظ المسار: ${namesList(bad)} غير مغطاة من شركات الشحن المختارة.`};
  }
  return {kind:'ok', html:'تم حفظ المسار.'};
}

function scopeBlock(k, st) {
  if (st.type === 'custom') return `<p class="muted" style="font-size:13px">التسمية الخاصة لا تخضع للتغطية، فالتاجر يحدد نطاقها.</p>`;
  if (!st.carriers.length) return '';
  const scope = st.regionOn ? st.cities : ALL;
  const cov = coverage(st.carriers);
  const ok = scope.filter(c => cov.has(c)), bad = scope.filter(c => !cov.has(c));
  const pct = scope.length ? Math.round(ok.length / scope.length * 100) : 0;
  const others = CARRIERS.filter(c => !st.carriers.includes(c.id) && c.cities.length);
  return `<div style="margin-top:12px"><b style="font-weight:500">نطاق المسار</b>
    ${scope.length ? `<div class="big">${ok.length} <span style="font-size:18px;font-weight:500">من ${scope.length}</span></div><div class="muted" style="font-size:13px">${st.regionOn ? 'من المدن المختارة' : 'من كل مدن السعودية'} يوصل لها المسار</div>
    <div class="meter"><span style="width:${pct}%"></span></div>` : `<p class="muted">لم تُختر مدن بعد.</p>`}
    ${!st.regionOn && bad.length ? `<div class="alert warn"><span class="grow">بدون شرط مناطق يُطبّق المسار على كل المدن، و<b>${nCities(bad.length)}</b> منها لا توصل لها شركاتك. العميل فيها سيرى «لا يوجد شركة شحن متوفرة».
      <div class="acts"><button class="btn-mint sm" data-act="limit" data-k="${k}">حصر المسار على ${nCitiesG(ok.length)} مغطاة</button></div></span></div>` : ''}
    ${st.regionOn && !bad.length && scope.length ? `<div class="alert ok"><span class="grow">مسارك يوصل لكل المدن التي اخترتها.</span></div>` : ''}
    ${bad.length ? `<div style="margin-top:12px"><span class="muted" style="font-size:13px">لا يوصل إلى (${bad.length})</span>${Object.entries(byRegion(bad)).map(([r, ids]) =>

function renderP3() {
  const st = S.p3;
  const cov = coverage(st.carriers);
  const covered = ALL.filter(c => cov.has(c));
  const missing = ALL.filter(c => !cov.has(c));
  let best = null;
  CARRIERS.filter(c => !st.carriers.includes(c.id)).forEach(c => {
    const n = c.cities.filter(x => missing.includes(x)).length;
    if (n && (!best || n > best.n)) best = {c, n};
  });
  let suggest = '';
  if (st.carriers.length && st.type !== 'custom') {
    suggest = `<div class="card" style="border:2px solid var(--mint-border);background:var(--mint-lt)"><h2>✦ اقتراح سلة</h2>
      ${!st.regionOn ? `<p style="margin:12px 0">شركاتك المختارة توصل إلى <b>${nCitiesG(covered.length)}</b> من ${CITIES.length}.</p>

      ${best ? `<div class="alert info"><span class="grow">${nCities(missing.length)} خارج التغطية. إضافة <b>${bn(best.c.name)}</b> (مفعّلة في متجرك) تغطي ${nCitiesG(best.n)} منها.

function setCarrier(st, id, on) {
  st.notice = null; st.saveMsg = null;
  if (on) {
    if (!st.carriers.includes(id)) st.carriers.push(id);
    const back = (st.removed[id] || []).filter(c => !st.cities.includes(c));
    if (back.length) { st.cities.push(...back); st.notice = {kind:'info', html:`أُعيدت ${nCities(back.length)}: ${namesList(back)}.`}; }
    delete st.removed[id];
    return;
  }
  st.carriers = st.carriers.filter(c => c !== id);
  if (st.type === 'custom' || !st.regionOn) return;
  const before = coverage([...st.carriers, id]);
  const cov = coverage(st.carriers);
  const lost = st.cities.filter(c => before.has(c) && !cov.has(c));
  if (lost.length) {
    st.cities = st.cities.filter(c => !lost.includes(c));
    st.removed[id] = lost;
    st.notice = {kind:'warn', html:`أُزيلت ${nCities(lost.length)} لأن شركات الشحن المختارة لا توصل لها: ${namesList(lost)}`};
  }
}

  if (st0 && st0.open && !e.target.closest('.dd')) { st0.open = ''; if (!t) { render(); return; } }
  if (!t) return;
  if (t.dataset.tab) { current = t.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const act = t.dataset.act, st = S[t.dataset.k], v = t.dataset.v;
  if (t.tagName === 'INPUT') return; // checkboxes and text inputs are handled by change/input
  switch (act) {
    case 'dd': st.open = st.open === v ? '' : v; st.q = ''; break;
    case 'type': st.type = v; st.saveMsg = null; break;
    case 'uncarrier': setCarrier(st, v, false); st.open = ''; break;
    case 'uncity': st.cities = st.cities.filter(c => c !== v); break;
    case 'addcond': st.regionOn = true; break;
    case 'delcond': st.regionOn = false; st.cities = []; st.notice = null; break;
    case 'save': st.saveMsg = validate(st); toast(st.saveMsg.kind === 'ok' ? 'تم حفظ المسار' : 'لم يُحفظ المسار'); break;
    case 'limit': { const cov = coverage(st.carriers); st.regionOn = true; st.cities = ALL.filter(c => cov.has(c)); st.notice = {kind:'ok', html:`تم حصر المسار على ${nCitiesG(st.cities.length)}.`}; break; }
    case 'p2preview': S.p2.preview = v; break;
    case 'p2cancel': S.p2.preview = null; break;
    case 'p2confirm': { const id = S.p2.preview; S.p2.preview = null; setCarrier(S.p2, id, false); break; }
    case 'p3apply': { const s = S.p3, cov = coverage(s.carriers); s.regionOn = true; s.cities = ALL.filter(c => cov.has(c)); break; }
    case 'p3add': setCarrier(S.p3, v, true); break; // widens the list only, never adds cities
    case 'p5ex': S.p5.excluded.push(v); break;
    case 'p5in': S.p5.excluded = S.p5.excluded.filter(c => c !== v); break;
    case 'golist': current = 'p6'; P6 = {edit:null, draft:null, addOpen:false, msg:null}; break;
    case 'p6edit': { const r = ROUTES.find(x => x.id === +v); P6 = {edit: r.id, draft: {...r, carriers:[...r.carriers], cities:[...r.cities]}, addOpen:false, msg:null}; window.scrollTo(0, 0); break; }
    case 'p6cancel': P6 = {edit:null, draft:null, addOpen:false, msg:null}; break;
    case 'p6strip': { const bad = uncovered(P6.draft); P6.draft.cities = P6.draft.cities.filter(c => !bad.includes(c)); P6.msg = null; break; }
    case 'p6addopen': P6.addOpen = !P6.addOpen; break;
    case 'p6add': P6.draft.carriers.push(v); P6.addOpen = false; P6.msg = null; break;
    case 'p6save': {
      const d = P6.draft;
      if (!d.cities.length) { P6.msg = {kind:'err', html:'المسار بلا وجهات. أضف شركة شحن تغطي مدنه، أو احذف المسار.'}; break; }
      const bad = uncovered(d);
      if (bad.length) { P6.msg = {kind:'err', html:`لا يمكن حفظ المسار: ${namesList(bad)} غير مغطاة من شركات الشحن المختارة.`}; break; }
      Object.assign(ROUTES.find(x => x.id === d.id), d);
      P6 = {edit:null, draft:null, addOpen:false, msg:null}; toast('تم حفظ المسار'); break;
    }
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target, act = t.dataset.act, st = S[t.dataset.k], v = t.dataset.v;
  if (act === 'carrier') { setCarrier(st, v, t.checked); if (st === S.p2) st.preview = null; }
  else if (act === 'city') { st.saveMsg = null; st.cities = t.checked ? [...st.cities, v] : st.cities.filter(c => c !== v); }
  else if (act === 'p4test') S.p4.test = t.value;
  else return;
  render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'q') { S[t.dataset.k].q = t.value; render(); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.act === 'dd') { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && S[current] && S[current].open) { S[current].open = ''; render(); }
});
render();
</script>
</body>
</html>
